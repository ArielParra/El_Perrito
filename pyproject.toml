[project]
name = "perrito"
version = "0.1.0"
description = "El perrito 🐶 - Generador de archivos PDF y EPUB a partir del acervo histórico de CONALITEG"
authors = [{ name = "ArielParra", email = "" }]
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ebooklib>=0.20",
    "img2pdf>=0.6.3",
    "pillow>=12.3.0",
    "pypdfium2>=5.14.0",
    "pytesseract>=0.3.13",
    "rapidocr-onnxruntime>=1.4.4",
    "reportlab>=5.0.1",
    "tqdm>=4.70.1",
]

[project.scripts]
perrito = "perrito.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]
